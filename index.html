<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Mensualidades - Parqueadero</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .badge-location { font-size: 0.9rem; }
    </style>
</head>
<body class="bg-light">

    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom text-center">
            <h1 class="h3 fw-bold text-primary">
                <i class="fas fa-motorcycle"></i> Control de Parqueadero (Sincronizado en Nube)
            </h1>
            <p class="text-muted m-0">Gestión de clientes y ubicaciones en tiempo real</p>
        </header>

        <div class="row">
            <!-- Formulario de Registro / Edición -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" id="form-title"><i class="fas fa-user-plus"></i> Registrar Cliente</h5>
                    </div>
                    <div class="card-body">
                        <form id="parking-form">
                            <input type="hidden" id="client-id">
                            
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del Cliente</label>
                                <input type="text" class="form-control" id="nombre" required placeholder="Ej. Carlos Pérez">
                            </div>

                            <div class="mb-3">
                                <label for="placa" class="form-label">Placa de la Moto</label>
                                <input type="text" class="form-control text-uppercase" id="placa" required placeholder="Ej. ABC-12D">
                            </div>

                            <div class="mb-3">
                                <label for="modelo" class="form-label">Modelo / Marca</label>
                                <input type="text" class="form-control" id="modelo" required placeholder="Ej. Yamaha FZ 150">
                            </div>

                            <div class="mb-3">
                                <label for="ubicacion" class="form-label">
                                    <i class="fas fa-map-marker-alt text-danger"></i> Ubicación en Parqueadero
                                </label>
                                <select class="form-select" id="ubicacion" required>
                                    <!-- Generado dinámicamente -->
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="fecha" class="form-label">Fecha de Cobro Mensual</label>
                                <input type="date" class="form-control" id="fecha" required>
                            </div>

                            <div class="mb-3">
                                <label for="observaciones" class="form-label">Observaciones</label>
                                <textarea class="form-control" id="observaciones" rows="2" placeholder="Ej. Casco guardado, paga puntual..."></textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success" id="btn-save">
                                    <i class="fas fa-cloud-upload-alt"></i> Guardar en Nube
                                </button>
                                <button type="button" class="btn btn-secondary d-none" id="btn-cancel">
                                    <i class="fas fa-times"></i> Cancelar Edición
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de Clientes -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-list"></i> Motos Registradas</h5>
                        <input type="text" id="search-input" class="form-control form-control-sm w-50" placeholder="Buscar por placa, nombre o ubicación...">
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-striped mb-0 align-middle text-center">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Nombre</th>
                                        <th>Placa</th>
                                        <th>Modelo</th>
                                        <th>Ubicación</th>
                                        <th>Próximo Cobro</th>
                                        <th>Observaciones</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="clients-table-body">
                                    <tr>
                                        <td colspan="7" class="py-4 text-muted">
                                            <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                                            Conectando con la base de datos...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TUS CREDENCIALES CONFIGURADAS
        const firebaseConfig = {
            apiKey: "AIzaSyBngeJ8WbnrFdHYnzg_9aE0PgiWQzmd_qA",
            authDomain: "control-y-cobro-parqueadero.firebaseapp.com",
            projectId: "control-y-cobro-parqueadero",
            storageBucket: "control-y-cobro-parqueadero.firebasestorage.app",
            messagingSenderId: "251886996202",
            appId: "1:251886996202:web:c42749ec24f1edcbfea593",
            measurementId: "G-326V9VQ3MH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const clientsCollection = collection(db, "clientes_parqueadero");

        let clients = [];

        // Elementos DOM
        const form = document.getElementById('parking-form');
        const clientIdInput = document.getElementById('client-id');
        const nombreInput = document.getElementById('nombre');
        const placaInput = document.getElementById('placa');
        const modeloInput = document.getElementById('modelo');
        const ubicacionSelect = document.getElementById('ubicacion');
        const fechaInput = document.getElementById('fecha');
        const observacionesInput = document.getElementById('observaciones');
        const btnSave = document.getElementById('btn-save');
        const btnCancel = document.getElementById('btn-cancel');
        const formTitle = document.getElementById('form-title');
        const searchInput = document.getElementById('search-input');
        const tableBody = document.getElementById('clients-table-body');

        function generateLocationOptions() {
            ubicacionSelect.innerHTML = '<option value="" disabled selected>Seleccione la ubicación...</option>';
            const addGroup = (label, prefix, max) => {
                let optGroup = document.createElement('optgroup');
                optGroup.label = label;
                for (let i = 1; i <= max; i++) {
                    let opt = document.createElement('option');
                    opt.value = `${prefix}${i}`;
                    opt.textContent = `${label.split(' ')[0]} - Espacio ${prefix.toUpperCase()}${i}`;
                    optGroup.appendChild(opt);
                }
                ubicacionSelect.appendChild(optGroup);
            };

            addGroup('Sótano (S)', 's', 11);
            addGroup('Piso (P)', 'p', 15);
            addGroup('Trasero (T)', 't', 10);
        }

        function renderTable(dataToRender = clients) {
            tableBody.innerHTML = '';
            if (dataToRender.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" class="text-muted py-4">No hay clientes registrados en la nube.</td></tr>`;
                return;
            }

            dataToRender.forEach(client => {
                const ubFormatted = client.ubicacion ? client.ubicacion.toUpperCase() : 'N/A';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold">${client.nombre}</td>
                    <td><span class="badge bg-secondary">${client.placa}</span></td>
                    <td>${client.modelo}</td>
                    <td><span class="badge bg-danger badge-location">${ubFormatted}</span></td>
                    <td>${client.fecha}</td>
                    <td class="text-muted small">${client.observaciones || 'Ninguna'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1 btn-edit" data-id="${client.id}" title="Modificar">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger btn-delete" data-id="${client.id}" title="Borrar">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => editClient(btn.dataset.id));
            });
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', () => deleteClient(btn.dataset.id));
            });
        }

        // Escuchar cambios en tiempo real
        onSnapshot(clientsCollection, (snapshot) => {
            clients = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderTable();
        }, (error) => {
            console.error("Error al conectar: ", error);
            tableBody.innerHTML = `<tr><td colspan="7" class="text-danger py-4">Revisa la pestaña de Reglas en Firestore.</td></tr>`;
        });

        // Guardar o actualizar registro
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = clientIdInput.value;
            const nuevaUbicacion = ubicacionSelect.value;

            const ocupada = clients.find(c => c.ubicacion === nuevaUbicacion && c.id !== id);
            if (ocupada) {
                alert(`¡Atención! El espacio ${nuevaUbicacion.toUpperCase()} ya está ocupado por la moto ${ocupada.placa} (${ocupada.nombre}).`);
                return;
            }

            const clientData = {
                nombre: nombreInput.value.trim(),
                placa: placaInput.value.trim().toUpperCase(),
                modelo: modeloInput.value.trim(),
                ubicacion: nuevaUbicacion,
                fecha: fechaInput.value,
                observaciones: observacionesInput.value.trim()
            };

            btnSave.disabled = true;
            btnSave.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Guardando...';

            try {
                if (id) {
                    await updateDoc(doc(db, "clientes_parqueadero", id), clientData);
                } else {
                    await addDoc(clientsCollection, clientData);
                }
                resetForm();
            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("Ocurrió un error al guardar los datos. Verifica las reglas de Firestore.");
            } finally {
                btnSave.disabled = false;
                btnSave.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Guardar en Nube';
            }
        });

        function editClient(id) {
            const client = clients.find(c => c.id === id);
            if (!client) return;
            clientIdInput.value = client.id;
            nombreInput.value = client.nombre;
            placaInput.value = client.placa;
            modeloInput.value = client.modelo;
            ubicacionSelect.value = client.ubicacion;
            fechaInput.value = client.fecha;
            observacionesInput.value = client.observaciones || '';

            formTitle.innerHTML = '<i class="fas fa-user-edit"></i> Modificar Cliente';
            btnSave.innerHTML = '<i class="fas fa-sync-alt"></i> Actualizar en Nube';
            btnSave.className = 'btn btn-warning text-white';
            btnCancel.classList.remove('d-none');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteClient(id) {
            if (confirm('¿Estás seguro de eliminar este cliente de la nube?')) {
                try {
                    await deleteDoc(doc(db, "clientes_parqueadero", id));
                } catch (error) {
                    console.error("Error al eliminar: ", error);
                    alert("Error al eliminar.");
                }
            }
        }

        function resetForm() {
            form.reset();
            clientIdInput.value = '';
            formTitle.innerHTML = '<i class="fas fa-user-plus"></i> Registrar Cliente';
            btnSave.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Guardar en Nube';
            btnSave.className = 'btn btn-success';
            btnCancel.classList.add('d-none');
        }

        btnCancel.addEventListener('click', resetForm);

        searchInput.addEventListener('keyup', () => {
            const query = searchInput.value.toLowerCase();
            const filtered = clients.filter(c => 
                c.nombre.toLowerCase().includes(query) || 
                c.placa.toLowerCase().includes(query) ||
                c.ubicacion.toLowerCase().includes(query)
            );
            renderTable(filtered);
        });

        generateLocationOptions();
    </script>
</body>
</html>
