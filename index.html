<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Mensualidades y Caja - Parqueadero</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .badge-location { font-size: 0.9rem; }
        .nav-pills .nav-link.active { background-color: #0d6efd; }
    </style>
</head>
<body class="bg-light">

    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom text-center">
            <h1 class="h3 fw-bold text-primary">
                <i class="fas fa-motorcycle"></i> Control de Parqueadero y Caja
            </h1>
            <p class="text-muted m-0">Gestión de mensualidades, registro de clientes y control de flujo de caja</p>
        </header>

        <!-- Navegación entre Pestañas -->
        <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 rounded shadow-sm" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="tab-clientes" data-bs-toggle="tab" data-bs-target="#content-clientes" type="button" role="tab">
                    <i class="fas fa-users me-2"></i>Gestión de Clientes
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="tab-caja" data-bs-toggle="tab" data-bs-target="#content-caja" type="button" role="tab">
                    <i class="fas fa-cash-register me-2"></i>Registro de Caja (Pagos)
                </button>
            </li>
        </ul>

        <div class="tab-content" id="mainTabsContent">

            <!-- PESTAÑA 1: GESTIÓN DE CLIENTES -->
            <div class="tab-pane fade show active" id="content-clientes" role="tabpanel">
                <div class="row">
                    <!-- Formulario Cliente -->
                    <div class="col-md-4 mb-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-primary text-white">
                                <h5 class="mb-0" id="form-title"><i class="fas fa-user-plus"></i> Registrar Cliente</h5>
                            </div>
                            <div class="card-body">
                                <form id="parking-form">
                                    <input type="hidden" id="client-id">
                                    
                                    <div class="mb-3">
                                        <label for="nombre" class="form-label">Nombre del Cliente</label>
                                        <input type="text" class="form-control" id="nombre" required placeholder="Ej. Carlos Pérez">
                                    </div>

                                    <div class="mb-3">
                                        <label for="placa" class="form-label">Placa de la Moto</label>
                                        <input type="text" class="form-control text-uppercase" id="placa" required placeholder="Ej. ABC-12D">
                                    </div>

                                    <div class="mb-3">
                                        <label for="modelo" class="form-label">Modelo / Marca</label>
                                        <input type="text" class="form-control" id="modelo" required placeholder="Ej. Yamaha FZ 150">
                                    </div>

                                    <div class="mb-3">
                                        <label for="ubicacion" class="form-label">
                                            <i class="fas fa-map-marker-alt text-danger"></i> Ubicación en Parqueadero
                                        </label>
                                        <select class="form-select" id="ubicacion" required></select>
                                    </div>

                                    <div class="mb-3">
                                        <label for="fecha" class="form-label">Fecha de Cobro Mensual</label>
                                        <input type="date" class="form-control" id="fecha" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="observaciones" class="form-label">Observaciones</label>
                                        <textarea class="form-control" id="observaciones" rows="2" placeholder="Ej. Casco guardado..."></textarea>
                                    </div>

                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-success" id="btn-save">
                                            <i class="fas fa-cloud-upload-alt"></i> Guardar Cliente
                                        </button>
                                        <button type="button" class="btn btn-secondary d-none" id="btn-cancel">
                                            <i class="fas fa-times"></i> Cancelar Edición
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Tabla Clientes -->
                    <div class="col-md-8">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                                <h5 class="mb-0"><i class="fas fa-list"></i> Motos Registradas</h5>
                                <input type="text" id="search-input" class="form-control form-control-sm w-50" placeholder="Buscar por placa, nombre o ubicación...">
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover table-striped mb-0 align-middle text-center">
                                        <thead class="table-dark">
                                            <tr>
                                                <th>Nombre</th>
                                                <th>Placa</th>
                                                <th>Modelo</th>
                                                <th>Ubicación</th>
                                                <th>Próximo Cobro</th>
                                                <th>Observaciones</th>
                                                <th>Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody id="clients-table-body">
                                            <tr><td colspan="7" class="py-4 text-muted">Cargando datos...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PESTAÑA 2: REGISTRO DE CAJA Y PAGOS MENSUALES -->
            <div class="tab-pane fade" id="content-caja" role="tabpanel">
                <div class="row">
                    <!-- Formulario de Movimiento de Caja -->
                    <div class="col-md-4 mb-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-success text-white">
                                <h5 class="mb-0"><i class="fas fa-receipt"></i> Registrar Transacción</h5>
                            </div>
                            <div class="card-body">
                                <form id="caja-form">
                                    <div class="mb-3">
                                        <label for="caja-fecha-pago" class="form-label fw-bold">Fecha del Pago / Movimiento</label>
                                        <input type="date" class="form-control" id="caja-fecha-pago" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="caja-tipo" class="form-label fw-bold">Tipo de Movimiento</label>
                                        <select class="form-select fw-bold" id="caja-tipo" required>
                                            <option value="ingreso" class="text-success">🟢 Ingreso (+)</option>
                                            <option value="egreso" class="text-danger">🔴 Egreso (-)</option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label for="caja-zona" class="form-label">1. Filtrar Zona / Ubicación</label>
                                        <select class="form-select" id="caja-zona">
