<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Mensualidades y Caja - Parqueadero</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .badge-location { font-size: 0.9rem; }
        .nav-pills .nav-link.active { background-color: #0d6efd; }
        
        /* Estilos del Mapa de Ubicaciones */
        .spot-card {
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
            min-height: 145px;
        }
        .spot-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15)!important;
        }
        .spot-card.occupied {
            background-color: #fff5f5;
            border: 2px solid #dc3545!important;
        }
        .spot-card.available {
            background-color: #f8fff9;
            border: 2px dashed #198754!important;
        }
        .spot-header {
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom text-center">
            <h1 class="h3 fw-bold text-primary">
                <i class="fas fa-motorcycle"></i> Control de Parqueadero y Caja
            </h1>
            <p class="text-muted m-0">Gestión de mensualidades, registro de clientes, ocupación e informe de caja</p>
        </header>

        <!-- Navegación entre Pestañas -->
        <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 rounded shadow-sm" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="tab-mapa" data-bs-toggle="tab" data-bs-target="#content-mapa" type="button" role="tab">
                    <i class="fas fa-th-large me-2"></i>Informe de Ubicaciones
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="tab-clientes" data-bs-toggle="tab" data-bs-target="#content-clientes" type="button" role="tab">
                    <i class="fas fa-users me-2"></i>Gestión de Clientes
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="tab-caja" data-bs-toggle="tab" data-bs-target="#content-caja" type="button" role="tab">
                    <i class="fas fa-cash-register me-2"></i>Registro de Caja (Pagos)
                </button>
            </li>
        </ul>

        <div class="tab-content" id="mainTabsContent">

            <!-- PESTAÑA 0: INFORME DE UBICACIONES / MAPA -->
            <div class="tab-pane fade show active" id="content-mapa" role="tabpanel">
                <!-- Resumen Global de Ocupación -->
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm bg-primary text-white">
                            <div class="card-body py-3 text-center">
                                <small class="text-uppercase fw-bold">Ocupación Total</small>
                                <h3 class="mb-0 fw-bold" id="map-total-occupied">0 / 36</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm bg-success text-white">
                            <div class="card-body py-3 text-center">
                                <small class="text-uppercase fw-bold">Espacios Disponibles</small>
                                <h3 class="mb-0 fw-bold" id="map-total-available">36</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm bg-dark text-white">
                            <div class="card-body py-3 text-center">
                                <small class="text-uppercase fw-bold">Porcentaje Libre</small>
                                <h3 class="mb-0 fw-bold" id="map-percent-available">100%</h3>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sub-Navegación de Zonas -->
                <ul class="nav nav-tabs mb-3" id="zoneTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active fw-bold text-dark" id="zone-s-tab" data-bs-toggle="tab" data-bs-target="#zone-s" type="button" role="tab">
                            <i class="fas fa-warehouse text-primary me-1"></i> Sótano (S1 - S11)
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-bold text-dark" id="zone-p-tab" data-bs-toggle="tab" data-bs-target="#zone-p" type="button" role="tab">
                            <i class="fas fa-building text-warning me-1"></i> Piso (P1 - P15)
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-bold text-dark" id="zone-t-tab" data-bs-toggle="tab" data-bs-target="#zone-t" type="button" role="tab">
                            <i class="fas fa-parking text-danger me-1"></i> Trasero (T1 - T10)
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="zoneTabsContent">
                    <!-- SÓTANO -->
                    <div class="tab-pane fade show active" id="zone-s" role="tabpanel">
                        <div class="row g-3" id="grid-sotano"></div>
                    </div>
                    <!-- PISO -->
                    <div class="tab-pane fade" id="zone-p" role="tabpanel">
                        <div class="row g-3" id="grid-piso"></div>
                    </div>
                    <!-- TRASERO -->
                    <div class="tab-pane fade" id="zone-t" role="tabpanel">
                        <div class="row g-3" id="grid-trasero"></div>
                    </div>
                </div>
            </div>

            <!-- PESTAÑA 1: GESTIÓN DE CLIENTES -->
            <div class="tab-pane fade" id="content-clientes" role="tabpanel">
                <div class="row">
                    <!-- Formulario Cliente -->
                    <div class="col-md-4 mb-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-primary text-white">
                                <h5 class="mb-0" id="form-title"><i class="fas fa-user-plus"></i> Registrar Cliente</h5>
                            </div>
                            <div class="card-body">
                                <form id="parking-form">
                                    <input type="hidden" id="client-id">
                                    
                                    <div class="mb-3">
                                        <label for="nombre" class="form-label">Nombre del Cliente</label>
                                        <input type="text" class="form-control" id="nombre" required placeholder="Ej. Carlos Pérez">
                                    </div>

                                    <div class="mb-3">
                                        <label for="placa" class="form-label">Placa de la Moto</label>
                                        <input type="text" class="form-control text-uppercase" id="placa" required placeholder="Ej. ABC-12D">
                                    </div>

                                    <div class="mb-3">
                                        <label for="modelo" class="form-label">Modelo / Marca</label>
                                        <input type="text" class="form-control" id="modelo" required placeholder="Ej. Yamaha FZ 150">
                                    </div>

                                    <div class="mb-3">
                                        <label for="ubicacion" class="form-label">
                                            <i class="fas fa-map-marker-alt text-danger"></i> Ubicación en Parqueadero
                                        </label>
                                        <select class="form-select" id="ubicacion" required></select>
                                    </div>

                                    <div class="mb-3">
                                        <label for="fecha" class="form-label">Fecha de Cobro Mensual</label>
                                        <input type="date" class="form-control" id="fecha" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="observaciones" class="form-label">Observaciones</label>
                                        <textarea class="form-control" id="observaciones" rows="2" placeholder="Ej. Casco guardado..."></textarea>
                                    </div>

                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-success" id="btn-save">
                                            <i class="fas fa-cloud-upload-alt"></i> Guardar Cliente
                                        </button>
                                        <button type="button" class="btn btn-secondary d-none" id="btn-cancel">
                                            <i class="fas fa-times"></i> Cancelar Edición
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Tabla Clientes -->
                    <div class="col-md-8">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                                <h5 class="mb-0"><i class="fas fa-list"></i> Motos Registradas</h5>
                                <input type="text" id="search-input" class="form-control form-control-sm w-50" placeholder="Buscar por placa, nombre o ubicación...">
                            </div>
                            <div class="card-body p-0">
                                <div class="table
